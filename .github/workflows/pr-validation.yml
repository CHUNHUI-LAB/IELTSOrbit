name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static and DOM validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out PR merge tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run non-browser JavaScript tests
        run: |
          status=0
          for test in tests/*.test.js; do
            if [[ "$test" == tests/browser.test.js ]]; then
              continue
            fi
            echo "::group::$test"
            node "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Validate HTML, paths and catalog
        if: ${{ !cancelled() }}
        run: python3 tests/validate.py
      - name: Check every JavaScript file for syntax errors
        if: ${{ !cancelled() }}
        run: find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
